<h1>Ollama 本地模型运行工具</h1>
<p>Ollama 是一个在本地运行大语言模型的开源工具，支持 Llama、Qwen、BGE 等模型，提供 REST API 与 OpenAI 兼容接口。</p>
<p>在 RAG 场景中，Ollama 常用于运行嵌入模型（如 bge-m3）。调用嵌入接口时，apiUrl 需要填写完整地址，例如 http://127.0.0.1:11434/api/embed，并配置 provider 或 standard 为 ollama。</p>
