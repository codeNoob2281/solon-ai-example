server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: rag-example

  # MySQL 数据源：知识库文档表（kb_document）+ 父块表（kb_chunk），MyBatis-Plus 持久层
  # URL 默认带 createDatabaseIfNotExist=true：库不存在自动创建；
  # Hikari 懒连接 + 未启用 sql.init：应用启动不要求 MySQL 在线，
  # 首次使用知识库时才建连/建表（DDL 见 resources/sql/knowledge_base.sql，与懒建表语句一致）
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/rag_demo?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}

# Solon AI ChatModel 自动装配配置（由 llm-core starter 提供，用于 RAG 问答生成）
ai:
  chat:
    openai:
      api-url: ${AI_API_URL:http://localhost:1234/v1}
      api-key: ${AI_API_KEY:sk-your-api-key}
      model: ${AI_MODEL:gpt-3.5-turbo}
      provider: openai
      logging-enabled: true

  # RAG 示例配置（前缀 ai.rag，见 RagProperties）
  rag:
    embedding:
      # Ollama bge-m3：apiUrl 用完整地址（不是 api_base），并配置 provider/standard = ollama
      api-url: ${RAG_EMBEDDING_API_URL:http://127.0.0.1:11434/api/embed}
      api-key: ${RAG_EMBEDDING_API_KEY:}
      model: ${RAG_EMBEDDING_MODEL:bge-m3:latest}
      provider: ${RAG_EMBEDDING_PROVIDER:ollama}
      standard: ${RAG_EMBEDDING_STANDARD:ollama}
      batch-size: ${RAG_EMBEDDING_BATCH_SIZE:10}
      # 请求超时秒数（框架默认 120s；挂死的请求会占住入库线程池线程）
      timeout-seconds: ${RAG_EMBEDDING_TIMEOUT_SECONDS:60}
      # 嵌入失败重试：最大尝试次数（含首次，1 = 不重试）与首次退避毫秒（之后按 2^n 指数递增）
      retry-max-attempts: ${RAG_EMBEDDING_RETRY_MAX_ATTEMPTS:3}
      retry-backoff-millis: ${RAG_EMBEDDING_RETRY_BACKOFF_MILLIS:1000}

    milvus:
      # 本地 Milvus Standalone（docker 默认端口 19530）
      uri: ${MILVUS_URI:http://localhost:19530}
      token: ${MILVUS_TOKEN:}
      username: ${MILVUS_USERNAME:}
      password: ${MILVUS_PASSWORD:}
      db-name: ${MILVUS_DB_NAME:}

    repository:
      # 子块向量集合（自建结构：id / parent_id 独立字段 / content / metadata / embedding）
      collection-name: ${MILVUS_COLLECTION:solon_rag_demo}

    # 父子分段参数（父/子均用 TokenSizeTextSplitter，jtokkit cl100k_base）：
    # 父块存 MySQL 分块表（检索命中后进 LLM 上下文，粒度大、上下文完整），
    # 子块存 Milvus（向量检索，粒度小、召回准）
    splitter:
      parent-chunk-size: ${RAG_PARENT_CHUNK_SIZE:1000}
      parent-min-chunk-size-chars: ${RAG_PARENT_MIN_CHARS:600}
      child-chunk-size: ${RAG_CHILD_CHUNK_SIZE:200}
      child-min-chunk-size-chars: ${RAG_CHILD_MIN_CHARS:50}
      min-chunk-length-to-embed: 10
      max-chunk-count: 1000
      keep-separator: true

    # 文档并行入库线程池：单线程处理最小维度 = 单个文档
    # （父子切分 → MySQL 落库 → 子块向量化 → 写入 Milvus 一个任务内完成）
    # 并行度建议参考嵌入服务的并发能力（Ollama 单模型默认近串行推理，调大无收益）
    ingestion:
      core-pool-size: ${RAG_INGEST_CORE_POOL_SIZE:4}
      max-pool-size: ${RAG_INGEST_MAX_POOL_SIZE:8}
      queue-capacity: ${RAG_INGEST_QUEUE_CAPACITY:256}   # 0 = SynchronousQueue 直接交接
      keep-alive-seconds: ${RAG_INGEST_KEEP_ALIVE_SECONDS:60}
      thread-name-prefix: ${RAG_INGEST_THREAD_NAME_PREFIX:rag-ingest-}
      allow-core-thread-timeout: ${RAG_INGEST_ALLOW_CORE_THREAD_TIMEOUT:true}

logging:
  level:
    com.example.ai: DEBUG
    org.noear: INFO
    org.noear.solon.ai.chat.dialect.AbstractChatDialect: INFO
    io.milvus: WARN
