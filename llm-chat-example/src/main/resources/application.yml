server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: llm-chat-example

# Solon AI ChatModel 自动装配配置（由 llm-core starter 提供）
# .env 文件中的同名配置会覆盖此处默认值
ai:
  chat:
    openai:
      api-url: ${AI_API_URL:http://localhost:1234/v1}
      api-key: ${AI_API_KEY:sk-your-api-key}
      model: ${AI_MODEL:gpt-3.5-turbo}
      provider: openai
      # 模型上下文窗口（tokens）：工作台用量面板的上下文占用率基准（也供框架上下文压缩拦截器参考）
      context-length: ${AI_CHAT_CONTEXT_LENGTH:128000}
      # 是否开启模型请求/响应日志（读环境变量，默认 false）
      logging-enabled: ${AI_CHAT_LOGGING_ENABLED:false}

    # 会话记忆配置（ChatMemoryService，基于 FileChatSession）
    session:
      # 对话记忆存储目录（相对路径，基于应用运行目录）
      memory-dir: ${AI_CHAT_MEMORY_DIR:temp/chat-memory}
      # 交互窗口大小：模型交互时只取最近 N 条消息作为上下文（文件保留完整历史）
      window-size: ${AI_CHAT_WINDOW_SIZE:20}

logging:
  level:
    com.example.ai: DEBUG
    org.noear: INFO
    org.noear.solon.ai.chat.dialect.AbstractChatDialect: INFO