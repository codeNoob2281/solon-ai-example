server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: llm-chat-example

# Solon AI ChatModel 自动装配配置（由 llm-core starter 提供）
# .env 文件中的同名配置会覆盖此处默认值
ai:
  chat:
    openai:
      api-url: ${AI_API_URL:http://localhost:1234/v1}
      api-key: ${AI_API_KEY:sk-your-api-key}
      model: ${AI_MODEL:gpt-3.5-turbo}
      provider: openai
      # 是否开启模型请求/响应日志（默认 true）
      logging-enabled: true

logging:
  level:
    com.example.ai: DEBUG
    org.noear: INFO
    org.noear.solon.ai.chat.dialect.AbstractChatDialect: INFO